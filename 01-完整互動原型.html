</style></head><body><div id="app"><p class="loading">正在讀取流程規格…</p></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div><script id="embedded-documents" type="application/json">["# 使用者流程\n\n版本：2026-10-30｜依本次再次更新的 FigJam 整理 v1.1\n\n## 資料來源與使用方式\n\n依 FigJam「參加者流程與領取方式」「主辦方」「主管」及本次新增的「活動專區_列表」畫面整理。\n來源：https://www.figma.com/board/aE7WDdKo2KeNrPQQNOkoiB/Untitled?node-id=0-1\n既有報到畫面參考：https://www.figma.com/design/z7TRrkJ3PX6TcjloQhZVqk/EBS?node-id=7366-12671\n本文件的 JSON 設定由 prototype 讀取，用來產生角色與領取方式；其餘段落供設計、開發與審閱使用。所有姓名、獎品、日期皆為示範資料。\n\n## 角色入口與權限\n\n- 使用者由 EBS 首頁進入活動專區，系統依帳號權限判斷參加者、主管、主辦方入口。\n- 正式產品不要求使用者手動選擇角色；既有 prototype 的角色切換僅供審閱與情境測試。\n- 主管可查看所屬單位名單；主辦方具有掃描、協助報到、代抽與代領權限。\n- 主管與主辦方也有本人報到、抽獎及查看結果的流程；是否可抽獎仍依本人資格與狀態判斷。\n\n## 參加者\n\n1. EBS 首頁 → 活動專區 P01。\n2. 未報到者先完成報到；已註記 No Show 者臨時到場仍能報到。\n3. 已報到且具抽獎資格、尚未抽獎者，點選「我要抽獎」。\n4. 進入 P02 抽獎動畫，再顯示 P03 抽獎結果／中獎紀錄。\n5. 已抽獎者再次進入時查看既有獎項，不再次抽獎。\n\n## 四種領取方式\n\n| 方式 | 參加者操作 | 狀態與注意事項 |\n| --- | --- | --- |\n| 現場 | P03 開啟 P07 靜態領獎碼 → 出示給主辦方 → 主辦方掃描核銷並交付 | 顯示未領取／已領取；靜態碼不設倒數；關閉或重開時讀取最新狀態 |\n| 行銷部 | 閱讀 P03 說明，活動結束後至行銷部領取 | 不顯示現場核銷狀態、不開啟領獎碼 |\n| 分公司 | 閱讀 P03 說明，由任職分公司安排發放 | 不填寄送地址；不顯示現場核銷狀態、不開啟領獎碼 |\n| 現金 | 閱讀 P03 匯款說明，由薪轉帳戶入帳 | 不新增銀行帳戶表單；不顯示現場核銷狀態、不開啟領獎碼 |\n\n## 主辦方：掃描與交付\n\nP01 或 P04 → P06 掃描 → 掃描有效的靜態領獎碼 → 立即核銷 → P05 結果 → 按獎品編號交付 → 關閉返回 P06。\n\n- P05 顯示獎品編號、獎項名稱、核銷成功／失敗與錯誤訊息。\n- 一般核銷不增加姓名、員編或身分核對步驟。\n- 已核銷、無效碼、非主辦方、資料錯誤等情況不能再次核銷。\n- 網頁原型使用「模擬掃描」，不要求相機權限，也不連接真實核銷系統。\n\n## 主辦方：代抽\n\nP04 找到同仁 → P08 顯示被代抽同仁姓名 → 確認代抽 → P02 → P03 顯示該同仁與獎項。\n\n- 同樣檢查報到與資格，且每人限抽一次。\n- 操作者由系統背景記錄，不新增協助者或代抽原因輸入欄位。\n\n## 主辦方：代領\n\nP04 找到已中獎且可現場領取的同仁 → P09 核對被代領同仁姓名、獎品編號、獎項名稱 → 確認代領 → P05 核銷結果 → 人工交付獎品。\n\n- 最新使用者流程與 UI Flow 均明確銜接 P09 → P05，不再次執行抽獎。\n- 依最新 IA，P05 關閉結果返回 P06 掃描頁；本版 prototype 已同步此返回路徑。\n- 操作者由系統背景記錄，不新增代領原因輸入欄位。\n- 原型限制代領為可核銷的現場獎項；其他領取方式依 P03 說明安排。這是為避免把外部發放誤當現場核銷的實作假設，後續可調整。\n\n## 主管\n\nP01 → P04 所屬單位名單 → 搜尋／篩選未抽獎、未領獎同仁 → 人工提醒。\n\n主管不提供代抽、代領、協助報到與掃描；沒有自動發送提醒功能。\n\n## 共用規則\n\n- 搜尋與篩選可搭配；篩選為單選並顯示數量。\n- No Show 保留備註，之後仍可報到；不沿用舊稿「不可修改或報到」的限制。\n- 身分、狀態皆為瀏覽器示範，重新整理保留；「重設示範」還原初始資料。\n- 報到定位／藍牙、抽獎 API、身分驗證、真實相機與核銷 API 均未串接。\n\n## 本次更新與待確認\n\n1. 已確認最新使用者流程與 UI Flow 的代領銜接為 P09 → P05；移除前版「P09 → P03／銜接待確認」註記。代抽則進入 P03，結果保留被代抽同仁姓名。\n2. P02 動畫是否保留、呈現形式仍待確認；原型先使用短暫黑白動畫。\n3. P01 的「已抽獎／未領獎」視為兩個資訊面向。非現場獎項不顯示未領獎狀態。\n4. 「其他」No Show 備註在原型提供自由文字；後端儲存與必填規則待確認。\n\n## 新增活動列表畫面補充\n\n- 最新 FigJam 新增「活動專區_列表」（7:6084），示範多張活動卡、完整活動名稱、單桌次與多桌次換行、無桌次、我要報到、已報到、已備註等情境。\n- 部分卡片含已報到／未報到人數、活動名單或掃描入口，實際顯示仍依系統權限判斷。\n- 卡片中的 2024/12/06、桌次與人數均為畫面樣本，不作為春酒正式日期、名單或統計資料。\n\n## 本文件與已交付原型的關係\n\n本次 V2 原型已依資料夾內三份 Markdown 同步更新，並重新生成獨立 HTML 與 ZIP。JSON 保留虛構的示範人物、日期與獎品說明，與正式流程規則分開解讀。\n\n## 原型可讀取設定\n\n```json\n{\n  \"entryMode\": \"system_permission\",\n  \"roles\": [\n    {\"id\":\"participant\",\"label\":\"參加者\",\"name\":\"林予安\",\"canRoster\":false,\"canAssist\":false,\"scope\":\"self\"},\n    {\"id\":\"supervisor\",\"label\":\"主管\",\"name\":\"陳映竹\",\"canRoster\":true,\"canAssist\":false,\"scope\":\"unit\"},\n    {\"id\":\"organizer\",\"label\":\"主辦方\",\"name\":\"王書禾\",\"canRoster\":true,\"canAssist\":true,\"scope\":\"all\"}\n  ],\n  \"methods\": [\n    {\"id\":\"onsite\",\"label\":\"現場\",\"instruction\":\"請至現場領獎處出示領獎碼，由工作人員掃描後交付獎品。\"},\n    {\"id\":\"marketing\",\"label\":\"行銷部\",\"instruction\":\"活動結束後，請於上班時間至行銷部領取，實際時間以主辦方通知為準。\"},\n    {\"id\":\"branch\",\"label\":\"分公司\",\"instruction\":\"由任職分公司統一安排發放，請依分公司通知領取，無須填寫寄送地址。\"},\n    {\"id\":\"cash\",\"label\":\"現金\",\"instruction\":\"獎金將依公司作業時程匯入薪轉帳戶，入帳時間以主辦方通知為準。\"}\n  ]\n}\n```\n", "# 頁面流程 UI Flow\n\n版本：2026-10-30｜依本次再次更新的 FigJam 整理 v1.1\n\n來源：https://www.figma.com/board/aE7WDdKo2KeNrPQQNOkoiB/Untitled?node-id=0-1\n\n角色入口由系統依帳號權限判斷；此文件描述產品流程，prototype 的角色切換僅供測試。\n\n## 頁面路由\n\n| 編號 | 頁面 | 進入方式 | 下一步 |\n| --- | --- | --- | --- |\n| P01 | 活動專區列表 | EBS 首頁 | 報到、P02、P03、依角色進 P04／P06 |\n| P02 | 抽獎動畫 | 本人抽獎或 P08 確認代抽 | P03；期間防止重複送出 |\n| P03 | 抽獎結果／中獎紀錄 | P02 完成，或 P01 查看獎項 | 現場獎項可開 P07；關閉回來源頁 |\n| P04 | 活動名單 | 主管／主辦方的 P01 | 主辦方協助報到、P08、P09、P06；主管查看 |\n| P05 | 核銷結果 | P06 掃描，或 P09 確認代領 | 關閉回 P06（依最新 IA） |\n| P06 | 掃描頁 | 主辦方 P01／P04 | 模擬掃描有效碼即核銷，顯示 P05 |\n| P07 | 靜態領獎碼 | P03 的現場領取獎項 | 關閉回 P03 並更新狀態 |\n| P08 | 代抽確認 | 主辦方 P04 | 確認 → P02 → P03；取消回 P04 |\n| P09 | 代領確認 | 主辦方 P04 | 確認 → P05；取消回 P04；成功結果 P05 關閉回 P06 |\n\n## 本人流程\n\nP01 未報到 → 報到確認 → 報到成功 → P01 可抽獎 → P02 → P03。\n\n- 已抽獎時，P01 改為「查看獎項」，保留原始結果。\n- 現場領取：P03 → P07 → 工作人員掃描 → 已核銷 → 關閉或重開後更新狀態。\n- 非現場領取：P03 顯示該領取方式說明；不提供 P07。\n\n## 主辦方流程\n\n- P01 → P04 → 搜尋、篩選 → 協助報到／調整 No Show 備註。\n- P04 → P08 → P02 → P03；確認與結果都能辨識被代抽同仁。\n- P04 → P09 → P05；確認顯示被代領同仁姓名、獎品編號與獎項名稱；成功後人工發獎，系統背景記錄協助者。P05 依 IA 關閉後返回 P06。\n- P01／P04 → P06 → P05 → P06。\n\n## 主管流程\n\nP01 → P04（僅所屬單位）→ 搜尋／篩選 → 人工提醒。無操作型協助按鈕。\n\n## 狀態與錯誤\n\n- 報到前不能抽獎；無抽獎資格者提供清楚說明。\n- 同一人不能重複抽獎；同一現場獎項不能重複核銷。\n- 無效 QR、權限不足、查無獎項、已核銷顯示失敗結果；關閉可返回繼續掃描。\n- 空搜尋、篩選後無資料、重新整理成功均有可讀提示。\n- No Show 備註不阻擋後續報到。\n- 原型切換角色、情境均位於手機外的示範控制區，並非產品功能。\n\n## 本次更新與來源註記\n\n- 最新 UI Flow 已明確為 P09 → P05，與使用者流程一致；不再列為衝突或待確認。\n- 代抽為 P04 → P08 → P02 → P03；使用者流程明確要求 P03 保留被代抽同仁姓名。\n- P05 的 IA 明列「關閉結果 → 返回 P06」，因此掃描與代領結果皆依此記錄。V2 已將前次獨立 HTML 的返回路徑從 P04 同步改為 P06。\n- P06 在 IA 未獨立展開，但 UI Flow 已存在，因此保留掃描頁；正式頁面開啟相機，prototype 仍以模擬掃描示範。\n- 新增「活動專區_列表」（7:6084）作為 P01 畫面參考：多張卡片、完整活動名稱、桌次換行、無桌次、報到狀態及依權限顯示的統計／名單／掃描入口。這些是同頁不同樣式，不新增頁碼。\n- 動畫是否保留及呈現方式仍待確認。\n\n## 原型可讀取設定\n\n```json\n{\n  \"entryMode\":\"system_permission\",\n  \"transitions\":[\n    {\"from\":\"P08\",\"action\":\"confirm_proxy_draw\",\"to\":\"P02\",\"then\":\"P03\",\"preserveTargetName\":true},\n    {\"from\":\"P09\",\"action\":\"confirm_proxy_claim\",\"to\":\"P05\"},\n    {\"from\":\"P05\",\"action\":\"close\",\"to\":\"P06\"}\n  ],\n  \"pages\":[\n    {\"id\":\"P01\",\"title\":\"活動專區\",\"description\":\"活動資訊、報到與抽獎入口\",\"group\":\"活動\"},\n    {\"id\":\"P02\",\"title\":\"抽獎中\",\"description\":\"短暫抽獎動畫，完成後顯示結果\",\"group\":\"抽獎\"},\n    {\"id\":\"P03\",\"title\":\"我的獎項\",\"description\":\"抽獎結果、領取方式與說明\",\"group\":\"抽獎\"},\n    {\"id\":\"P04\",\"title\":\"活動名單\",\"description\":\"搜尋、狀態篩選與主辦方協助操作\",\"group\":\"名單\"},\n    {\"id\":\"P05\",\"title\":\"核銷結果\",\"description\":\"核銷成功或失敗與獎項資訊；關閉返回 P06\",\"group\":\"領獎\"},\n    {\"id\":\"P06\",\"title\":\"掃描領獎碼\",\"description\":\"掃描有效領獎碼即核銷\",\"group\":\"領獎\"},\n    {\"id\":\"P07\",\"title\":\"領獎碼\",\"description\":\"供現場工作人員掃描的靜態碼\",\"group\":\"領獎\"},\n    {\"id\":\"P08\",\"title\":\"代抽確認\",\"description\":\"核對被代抽同仁姓名\",\"group\":\"協助\"},\n    {\"id\":\"P09\",\"title\":\"代領確認\",\"description\":\"核對被代領同仁姓名與獎項\",\"group\":\"協助\"}\n  ]\n}\n```\n", "# IA 架構\n\n版本：2026-10-30｜依本次再次更新的 FigJam 整理 v1.1\n\n來源：https://www.figma.com/board/aE7WDdKo2KeNrPQQNOkoiB/Untitled?node-id=0-1\n\n角色入口由系統權限判斷。資訊架構依最新版三個流程區塊整理，另補充新增的活動專區列表畫面。\n\n## 資訊階層\n\n- EBS 首頁\n  - 活動專區 P01\n    - 報到與備註（沿用既有報到基礎）\n    - 抽獎動畫 P02\n      - 抽獎結果／中獎紀錄 P03\n        - 現場靜態領獎碼 P07\n    - 活動名單 P04（主管、主辦方）\n      - 協助報到／No Show 備註（主辦方）\n      - 代抽確認 P08 → P02 → P03\n      - 代領確認 P09 → P05 → 關閉回 P06\n      - 掃描 P06 → 核銷結果 P05（主辦方）\n    - 掃描 P06（主辦方直接入口）\n\n## P01 活動專區列表\n\n- 活動資訊：活動日期、活動名稱、桌次。\n- 報到／備註：已報到、未報到、已備註。\n- 抽獎資訊：未抽獎／已抽獎；現場獎項另區分未領獎／已領獎。\n- 操作：我要報到、我要抽獎、查看獎項。\n- 主管／主辦方：活動名單；僅主辦方：掃描。\n- 依角色權限顯示已報到／未報到人數、名單與掃描入口，沿用既有報到基礎。\n\n### 新增畫面參考：活動專區_列表（7:6084）\n\n- 同一頁以多張卡片列出活動，卡片高度依內容調整。\n- 活動名稱完整顯示，不將長名稱截斷當成既定規則。\n- 桌次支援單一桌號、範圍及多個桌號，過長可換行；畫面也包含隱藏桌次的卡片樣式。\n- 操作／狀態樣式：我要報到、已報到、已備註。\n- 部分卡片顯示報到人數、活動名單，另有含掃描入口的樣式；不依卡片排列順序推定角色。\n- 日期 2024/12/06、樣本活動名稱、88888 等數值僅作版面資料，不當作正式活動資料。\n\n## P02 抽獎動畫\n\n- 顯示抽獎進行狀態。\n- 待確認動畫是否保留／呈現方式；原型使用短暫黑白動畫。\n\n## P03 抽獎結果／中獎紀錄\n\n- 獎品編號、獎項名稱。\n- 領取方式：現場、行銷部、分公司、現金。\n- 領取說明。\n- 領取狀態：只有現場領取顯示未領取／已領取。\n- 開啟領獎碼：只有現場領取且未領取時提供；已領取則顯示完成狀態。\n- 關閉／返回。\n- 代抽情境加上被代抽同仁姓名，不把該獎項誤顯示為操作者本人中獎。\n\n## P04 活動名單\n\n- 同仁姓名、體系、職稱、部門、桌次。\n- 報到狀態：已報到、未報到、未報到但已備註。\n- 備註分類：病假、事假、其他。\n- 抽獎狀態：未抽獎、已抽獎；現場獎項另有未領獎、已領獎。\n- 搜尋：示範提供姓名／員編。員編是搜尋用示範資料，不新增一般掃碼核銷欄位。\n- 篩選與數量：全部、已報到、未報到、No Show、未抽獎、未領獎。\n- 單選篩選可搭配搜尋；支援下拉更新與更新按鈕。\n- 主辦方：協助報到、協助抽獎、協助領獎、掃描、備註。\n- 主管：僅所屬單位，查看與人工提醒；不提供上述主辦方操作。\n\n## P05 核銷結果\n\n- 獎品編號、獎項名稱。\n- 核銷成功／失敗。\n- 系統錯誤訊息。\n- 最新 IA 明列「關閉結果 → 返回 P06」；此版文件對掃描與代領結果均採此返回路徑。\n- V2 已將前次獨立 prototype 的返回路徑從 P04 同步改為 P06。\n- 一般掃描不顯示姓名、員編；代領結果可辨識被代領同仁。\n\n## P06 掃描頁\n\n- 此頁在 UI Flow 有定義，IA 原稿未獨立列出。\n- 掃描靜態領獎碼，成功讀取且檢核通過即核銷。\n- 原型以模擬掃描選單呈現，清楚標記示範。\n\n## P07 靜態領獎碼\n\n- 靜態 QR Code。\n- 不使用倒數或定時換碼；重新進入仍為同一筆獎項。\n- 原型碼為視覺示意，實際操作由 P06 模擬掃描完成。\n- 若已核銷，顯示已領取提示，避免再次出示待領狀態。\n\n## P08 代抽確認\n\n- 被代抽同仁姓名。\n- 確認代抽／取消。\n\n## P09 代領確認\n\n- 被代領同仁姓名。\n- 獎品編號、獎項名稱。\n- 確認代領／取消。\n\n## 原型邊界與待確認\n\n- 非正式抽獎系統；資料僅存於目前瀏覽器，不連接 EBS。\n- 抽獎分配在原型為固定情境，不能當作正式抽獎演算法。\n- 報到資格與領取說明內容為示範，實際判定、發放時間與 API 待定。\n- P09 → P05 已在最新使用者流程與 UI Flow 一致呈現，已移除銜接待確認。P02 動畫是否保留／呈現方式仍待確認。\n- 本次 V2 已更新 prototype 並重新生成獨立 HTML 與 ZIP，未修改 FigJam。\n- 搜尋姓名／員編、自由輸入其他備註、非現場獎項不提供代領，均沿用前版示範假設；最新圖未補充其細部規則，不視為正式定案。\n- 原型讀取三份 Markdown 的 JSON 區塊；頁面資料、角色與篩選以設定產生。修改純文字說明會更新文件閱讀區；調整 JSON 設定可改變對應原型設定。\n\n## 原型可讀取設定\n\n```json\n{\n  \"event\":{\"name\":\"春酒同樂會\",\"subtitle\":\"SPRING BANQUET\",\"date\":\"2027/03/12（五）18:00\",\"venue\":\"活動會場・宴會廳\",\"demo\":true},\n  \"filters\":[\n    {\"id\":\"all\",\"label\":\"全部\"},\n    {\"id\":\"checked\",\"label\":\"已報到\"},\n    {\"id\":\"unchecked\",\"label\":\"未報到\"},\n    {\"id\":\"noshow\",\"label\":\"No Show\"},\n    {\"id\":\"undrawn\",\"label\":\"未抽獎\"},\n    {\"id\":\"unclaimed\",\"label\":\"未領獎\"}\n  ],\n  \"noShowReasons\":[\"病假\",\"事假\",\"其他\"],\n  \"entryMode\":\"system_permission\",\n  \"redemptionResultReturn\":\"P06\",\n  \"listPresentation\":{\"fullActivityName\":true,\"multipleTablesWrap\":true,\"optionalTableField\":true,\"roleBasedActions\":true},\n  \"rules\":{\"checkInBeforeDraw\":true,\"oneDrawPerPerson\":true,\"immediateScanRedemption\":true,\"claimStatusForOnsiteOnly\":true,\"noShowMayCheckIn\":true,\"staticCode\":true}\n}\n```\n", "# Prototype 調整紀錄｜2026/11/02\n\n## 本次範圍\n\n僅更新 `Prototype/01-完整互動原型.html`。三份手機版 HTML 不同步修改。原有三份流程 Markdown 保留；本文件補充並優先覆蓋與本次指示衝突的舊描述，且已內嵌至完整原型的「規格文件」。\n\n## 活動專區\n\n- 日期一律使用 YYYY/MM/DD，移除年月日之間的句點，例如 2027/03/12（五）。\n- 初次進入仍為「我要報到」，不跳過報到。\n- 本人「我要報到」及主辦方「協助報到」均為點擊即完成報到，立即更新人員報到資料。\n- 移除「確認報到？」及「確認報到」的前置確認層，不再要求第二次確認。\n- 完成後只顯示一層「報到成功」彈窗，依指定設計呈現公司、部門、姓名及職稱、日期、活動名稱和桌次。\n- 桌次標題與號碼採上下排列；桌次可換行並完整顯示。沒有桌次時不額外顯示空白桌次欄。\n- 成功彈窗以卡片下方獨立的圓形關閉圖示關閉；關閉後可繼續抽獎或名單作業。\n- No Show 同仁臨時到場仍可直接報到，不增加前置確認。\n- 參考：[報到成功畫面](https://www.figma.com/design/z7TRrkJ3PX6TcjloQhZVqk/EBS?node-id=7366-9063)。延續黑白稿，以灰階呈現原設計品牌色。\n\n## 活動名單\n\n- 篩選 chip 保留「全部、已報到、未報到、No Show、未抽獎、未領獎」，各顯示數量。\n- chip 允許換行，確保「未領獎」在畫面中直接可見，且可實際篩選未核銷的現場獎項。\n- 移除列表的「共 X 位同仁」與「更新名單」按鈕；仍保留既有下拉更新行為。\n- 卡片保留同仁姓名；左側上到下依序為體系、職稱、公司「可樂旅遊」及所屬部門、桌次標題與號碼。\n- 右側同時呈現兩組獨立狀態：第一組為報到狀態（未報到／已報到／已備註及原因）；第二組為抽獎或領獎狀態（未抽獎／已抽獎／未領獎／已領獎）。\n- 示範資料包含「未報到＋未抽獎」「已報到＋未抽獎」「已報到＋未領獎」「已報到＋已領獎」等雙狀態組合。\n- 主辦方卡片保留右上角 No Show 編輯圖示，以及協助報到、代抽、代領等既有操作。主管卡片套用相同欄位及雙狀態排列，但不新增主辦方操作權限。\n- 非現場獎項依原規則顯示已抽獎，不誤列為待現場領獎。\n- 參考：[活動名單欄位與卡片](https://www.figma.com/design/z7TRrkJ3PX6TcjloQhZVqk/EBS?node-id=7366-9747)。左側採使用者指定的縱向欄位順序，右側補足本次要求的雙狀態。\n\n## 原型設定補充\n\n```json\n{\n  \"ui\": {\n    \"dateSeparator\": \"/\",\n    \"checkInConfirmation\": false,\n    \"checkInResult\": \"success_dialog\",\n    \"showRosterTotal\": false,\n    \"showRosterRefreshButton\": false,\n    \"wrapRosterFilters\": true,\n    \"cardStatusPosition\": \"right\",\n    \"cardStatusGroups\": [\"attendance\", \"lottery\"]\n  }\n}\n```\n\n\n## 第二次調整｜2026/11/02\n\n以下內容優先覆蓋第一次調整中對相同項目的描述；第一次紀錄保留作為歷程。本次仍僅更新完整互動原型，三份手機版維持原狀。\n\n### 抽獎結果／中獎紀錄\n\n- 現場獎項的領取狀態統一移至「領取說明」下方，不再置於獎項卡內。\n- 結果頁返回按鈕文案統一為「關閉」。\n- 移除「本獎項已完成現場領取」說明文字；已領取時僅呈現領取狀態。\n- 非現場獎項仍依既有規則不呈現現場領取狀態或領獎碼。\n\n### 活動名單\n\n- Chip 改為單行左右滑動，不換行；保留全部六種篩選與數量。此項覆蓋第一次的換行規則。\n- 卡片右側兩組狀態維持無框線文字，兩格平均分配並撐滿資訊區的可用高度。\n- CTA 移至卡片最下方右側，與左側桌次位於同一列並垂直置中。\n- No Show 編輯圖示保留於未報到同仁卡片右上角。\n- No Show 備註依 [7366:9794](https://www.figma.com/design/z7TRrkJ3PX6TcjloQhZVqk/EBS?node-id=7366-9794) 改為底部選單：病假、事假、公假、其他，右側顯示選取勾號，底部為左取消、右確定。\n- 選擇「其他」只保存選項，不需填寫說明；移除說明輸入欄與舊清除備註選項。\n- 參考稿內「備註後無法修改和報到」屬舊規則，本版不沿用該警告，繼續採用已確認的 No Show 可修改及臨時到場仍可報到規則。\n- 掃描領獎碼入口由名單頁底部移至 topbar 右側，只顯示掃描圖示；僅主辦方可見。\n\n### 報到成功\n\n- 桌次號碼置中對齊，保留換行與完整桌號。\n\n### 代抽確認\n\n- 姓名核對內容置於灰色色塊。\n- 按鈕改為水平排列，左側取消，右側「確認待抽」（依本次指定文案）。\n\n### 代抽結果與協助代領\n\n- 主辦方查看代抽結果，若獎項為現場領取且尚未領取，新增「協助代領」按鈕。\n- 點擊「協助代領」直接執行核銷並顯示「代領核銷成功」，不再經過 P09 確認。\n- 保存被協助同仁、獎項與協助者的背景操作紀錄；已領取或非現場獎項不提供此按鈕，防止重複核銷。\n- 名單原有「協助領獎」仍沿用 P09 確認流程；此快速路徑只新增於代抽／同仁結果視窗。\n\n### 第二次原型設定覆蓋\n\n```json\n{\n  \"noShowReasons\": [\"病假\", \"事假\", \"公假\", \"其他\"],\n  \"ui\": {\n    \"dateSeparator\": \"/\",\n    \"checkInConfirmation\": false,\n    \"checkInResult\": \"success_dialog\",\n    \"showRosterTotal\": false,\n    \"showRosterRefreshButton\": false,\n    \"wrapRosterFilters\": false,\n    \"cardStatusPosition\": \"right\",\n    \"cardStatusGroups\": [\"attendance\", \"lottery\"],\n    \"cardStatusBorder\": false,\n    \"cardStatusFillHeight\": true,\n    \"cardActionAlign\": \"table_row\",\n    \"scanEntry\": \"topbar_icon\",\n    \"claimStatusPosition\": \"below_instructions\",\n    \"prizeCloseLabel\": \"關閉\",\n    \"noShowPresentation\": \"bottom_sheet\",\n    \"noShowOtherDescription\": false,\n    \"proxyDrawConfirmLabel\": \"確認待抽\",\n    \"proxyDrawButtons\": \"cancel_left_confirm_right\",\n    \"proxyResultDirectClaim\": true\n  }\n}\n```\n\n### 狀態樣式修正｜2026/11/02\n\n- 依最新調整移除活動名單右側狀態框線，恢復原本無框線樣式。\n- 保留右側雙狀態排列、資訊區高度與底部 CTA 對齊方式。\n\n## 第三次調整｜2026/11/02\n\n本節為最新規則，優先覆蓋前述同項目設定。僅更新完整互動原型。\n\n### 統一代抽與代領結果\n\n- 代為領獎完成後直接使用 P05「核銷結果」畫面，成功標題統一為「核銷成功」，不再使用獨立的「代領核銷成功」版本。\n- 代為抽獎完成後直接使用 P03「抽獎結果」畫面，與本人抽獎共用標題、獎項與領取資訊，不再顯示「同仁獎項」版本。\n- 移除代抽結果內「協助代領」按鈕及直接代領路徑；代領仍由活動名單入口進入既有確認流程。實際操作對象、權限與背景紀錄保持原規則。\n\n### 活動名單\n\n- 所有「協助」CTA 改為「我要」：我要報到、我要抽獎、我要領獎；仍對該卡片同仁執行操作。\n- 篩選維持單行左右滑動，下方顯示可拖曳的水平 scrollbar，保留全部、已報到、未報到、No Show、未抽獎、未領獎六項與數量。\n- 狀態維持無框線，卡片雙狀態與 CTA 位置不變。\n\n### 靜態領獎碼彈窗\n\n- 移除上方「靜態領獎碼」標題與 QR 示意圖說明，保留出示提示、領獎碼及關閉圖示。\n- 底部按鈕改為「關閉」，關閉領獎碼後回到抽獎結果。\n\n### 抽獎結果\n\n- 將「現場領取」從獎項卡移至領取說明下方的狀態列，取代「領取狀態」文字；右側保留未領取／已領取。\n- 非現場獎項保留原有領取方式與說明。\n\n### 第三次原型設定覆蓋\n\n```json\n{\n  \"ui\": {\n    \"dateSeparator\": \"/\",\n    \"checkInConfirmation\": false,\n    \"checkInResult\": \"success_dialog\",\n    \"showRosterTotal\": false,\n    \"showRosterRefreshButton\": false,\n    \"wrapRosterFilters\": false,\n    \"cardStatusPosition\": \"right\", function note(s,id,role,text){if(role!=='organizer')throw Error('僅主辦方可以編輯備註。');const p=person(s,id);if(p.checked)throw Error('已報到同仁不需註記 No Show。');p.note=text;log(s,'note',id,role);}

function render(){if(MOBILE)return renderMobile();const p=current(),perm=permission();$('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="wordmark">EBS</div><div><h1>春酒抽獎</h1><div class="eyebrow">黑白互動原型・11/02</div></div></div><div class="top-actions"><button class="outline" data-action="docs">${icon('doc')}規格文件</button></div></header><main class="workspace"><aside class="rail left-rail"><section class="railsection"><h2>預覽身分</h2><div class="roles">${config.roles.map(r=>`<button class="role-btn ${r.id===role?'active':''}" data-role="${r.id}" aria-pressed="${r.id===role}"><strong>${esc(r.label)}</strong><span class="tick">${r.id===role?'●':''}</span></button>`).join('')}</div><p class="micro">以下為原型測試控制，不屬於產品畫面。</p></section><section class="railsection scenario-section"><h2>預覽狀態</h2><div><label class="field-label" for="scenario">本人活動狀態</label><select class="select" id="scenario"><option value="before">尚未報到</option><option value="ready">已報到・尚未抽獎</option><option value="noshow">已備註・臨時到場</option><option value="ineligible">未具抽獎資格</option><option value="onsite">已中獎・現場領取</option><option value="claimed">已完成現場領取</option><option value="marketing">已中獎・行銷部領取</option><option value="branch">已中獎・分公司領取</option><option value="cash">已中獎・現金入帳</option></select></div><div><label class="field-label" for="table-layout">桌次顯示</label><select id="table-layout" class="select"><option value="single">單一桌次</option><option value="multiple">多桌次換行</option><option value="none">無桌次</option></select></div><div><label class="field-label" for="draw-method">下次抽獎的領取方式</label><select class="select" id="draw-method">${config.methods.map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join('')}</select></div></section>${view==='P06'?scanControls():''}<button class="quiet reset" data-action="reset">${icon('refresh')}重設示範資料</button></aside><section class="device-column" aria-label="手機原型"><div class="device-caption"><span>${esc(perm.label)}</span><span>375px</span></d function scanControls(){return `<section class="railsection"><h2>掃描測試</h2><label for="scan-target" class="field-label">模擬領獎碼</label><select id="scan-target" class="select">${state.people.filter(p=>p.prize?.method==='onsite').map(p=>`<option value="${p.id}">${esc(p.prize.number)}・${esc(p.prize.name)}</option>`).join('')}<option value="unknown">查無獎項資料</option></select><button class="outline" data-action="scan-now" style="margin-top:12px">模擬掃描並核銷</button><p class="micro">此為測試控制，未連接相機與核銷服務。</p></section>`;}
function rightRail(){const id=modalPage||view,p=page(id),steps=role==='organizer'?[['P01','活動與作業入口'],['P04','查找同仁、協助操作'],['P06','掃描靜態領獎碼'],['P05','核銷並交付獎項']]:role==='supervisor'?[['P01','本人活動與抽獎'],['P04','所屬單位名單'],['','人工提醒同仁']]:[['P01','完成活動報到'],['P02','參加抽獎'],['P03','查看獎項與領取方式'],['P07','現場出示領獎碼']];return `<section class="railsection"><div class="page-chip">${p.id} / CURRENT SCREEN</div><h2 class="page-title">${esc(p.title)}</h2><p class="lede">${esc(p.description)}</p><ol class="flowlist">${steps.map(([s,t])=>`<li class="${s===id?'current':''}"><div>${esc(t)}${s?`<small>${s}</small>`:''}</div></li>`).join('')}</ol></section><section class="railsection"><h2><span class="stepnum">MD</span>流程與資訊架構</h2><div class="doclinks">${docNames.map((n,i)=>`<button class="doclink" data-doc="${i}">${esc(n)}<span>↗</span></button>`).join('')}</div><p>原型已載入三份 Markdown，角色、頁面及篩選設定來自文件。</p></section><div class="versionnote">沿用 EBS 活動卡與名單基礎<br>來源：FigJam 最新整理<br>待確認：動畫形式、代領結果銜接</div>`;}
function syncRail(){const r=$('.right-rail');if(r){r.innerHTML=rightRail();r.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>showDocs(+b.dataset.doc));}}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;view='P01';query='';filter='all';scenario='before';render();});document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>showDocs(+b.dataset.doc));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const old=$('.filters').scrollLeft;filter=b.dataset.filter;render();$('.filters').scrollLeft=old;});document.querySelectorAll('[data-draw]').forEach(b=>b.onclick=()=>beginDraw(b.dataset.draw));document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>showPrize(b.dataset.result));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>completeCheckIn(b.dataset.check));document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>editNote(b.dataset.note));document.querySelectorAll('[data-proxy-draw]').forEach(b=>b.onclick=()=>proxyDraw(b.dataset.proxyDraw));document.querySelectorAll('[data-proxy-claim]').forEach(b=>b.onclick=()=>proxyClaim(b.dataset.proxyClaim));if($('#scenario'))$('#scenario').onchange=e=>setScenario(e.target.value);if($('#draw-method'))$('#draw-method').onchange=e=>method=e.target.value;if($('#table-layout'))$('#table-layout').onchange=e=>{tableLayout=e.target.value;render();};const search=$('#search');if(search)search.oninput=e=>{query=e.target.value;$('.roster-list').innerHTML=rosterList();bind();};}
function action(a){if(a==='search'){const input=$('#search');if(input){$('#mobile-screen').scrollTop=0;input.focus({preventScroll:true});}return;}if(a==='docs')return showDocs(0);if(a==='roster'){if(!permission().canRoster)return toast('此身分沒有名單權限。');view='P04';query='';filter='all';render();}if(a==='scan'){if(!permission().canAssist)return toast('僅主辦方可掃描核銷。');view='P06';render();}if(a==='back'||a==='home'){view='P01';render();}if(a==='self-check')completeCheckIn(current().id);if(a==='eligibility')message('抽獎資格說明','您目前未具本次抽獎資格，如有疑問請洽主辦方。');if(a==='refresh'){render();toast('名單已更新');}if(a==='clear-search'){query='';filter='all';render();}if(a==='scan-now')scanNow();if(a==='reset'){state=fresh();save();scenario='before';view='P01';render();toast('已還原全部示範資料');}if(a==='ebs')showHome();if(a==='profile')message('我的資料',`${current().name}・${current().unit}・${current().title}`);}
function bindPull(){const screen=$('#mobile-screen');if(!screen||view!=='P04')return;let start=null;screen.addEventListener('touchstart',e=>{if(screen.scrollTop===0)start=e.touches[0].clientY;},{passive:true});screen.addEventListener('touchend',e=>{if(start!==null&&e.changedTouches[0].clientY-start>70)action('refresh');start=null;},{passive:true});}
function setScenario(s){scenario=s;const p=current();Object.assign(p,{checked:true,eligible:true,note:'',prize:null});if(s==='before')p.checked=false;if(s==='noshow'){p.checked=false;p.note='病假';}if(s==='ineligible')p.eligible=false;if(['onsite','claimed','marketing','branch','cash'].includes(s))p.prize={...PRIZES[s==='claimed'?'onsite':s],claimed:s==='claimed'};save();view='P01';render();toast('已切換本人活動情境');}
function dialog(id,title,body,{locked=false,wide=false}={}){const existing=$('dialog');if(existing)existing.close();modalPage=id;lastFocus=document.activeElement;$('#overlay').innerHTML=`<dialog class="${wide?'docs-dialog':''}"><div class="modal-head"><strong>${esc(title)}</strong>${locked?'':`<button class="iconbtn" id="modal-close" aria-label="關閉">${icon('close')}</button>`}</div>${body}</dialog>`;const d=$('dialog');d.addEventListener('cancel',e=>{e.preventDefault();if(!locked)closeDialog();});if(!locked)$('#modal-close').onclick=closeDialog;d.showModal();syncRail();return d;}
function closeDialog(){const d=$('dialog');if(d)d.close();$('#overlay').innerHTML='';modalPage='';render();if(lastFocus?.isConnected)lastFocus.focus();}
function message(title,text){dialog('',title,`<div class="modal-body"><div class="medallion">${icon('info')}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="primary" id="message-ok">我知道了</button></div>`);$('#message-ok').onclick=closeDialog;}
function completeCheckIn(id){try{const p=person(state,id),table=id===current().id?tableText(p):p.table;checkIn(state,id,role);save();showCheckInSuccess(p,table);}catch(e){message('無法報到',e.message);}}
function showCheckInSuccess(p,table){const existing=$('dialog');if(existing)existing.close();modalPage='';lastFocus=document.activeElement;$('#overlay').innerHTML=`<dialog class="checkin-success-dialog" aria-label="報到成功"><section class="checkin-success-card"><h2>報到成功</h2><div class="success-company">可樂旅遊<br>${esc(p.unit)}</div><div class="success-person">${esc(p.name)} ${esc(p.title)}</div><div class="success-event"><div>${esc(config.event.date.replace(/\s*\d{1,2}:\d{2}.*$/,''))}</div><div>${esc(config.event.name)}</div></div>${table?`<div class="success-table"><span>桌次</span><strong>${esc(table)}</strong></div>`:''}</section><div class="success-close-row"><button class="success-close" id="check-done" aria-label="關閉報到成功"><img src="data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjIwIiBoZWlnaHQ9IjIwIiB2aWV3Qm94PSIwIDAgMjAgMjAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJjbG9zZV9sX3ByaW1hcnkiPgo8cGF0aCBpZD0iUGF0aCA3MiIgZD0iTTQgNEwxNiAxNiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZT0id2hpdGUiLz4KPHBhdGggaWQ9IlBhdGggNzMiIGQ9Ik0xNiA0TDQgMTYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2U9IndoaXRlIi8+CjwvZz4KPC9zdmc+Cg==" width="20" height="20" alt=""></button></div></dialog>`;const d=$('dialog');d.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});$('#check-done').onclick=closeDialog;d.showModal();}
function proxyDraw(id){const p=person(state,id);if(!permission().canAssist)return toast('僅主辦方可以協助抽獎。');dialog('P08','代抽確認',`<div class="modal-body"><div class="medallion">${icon('gift')}</div><h2>確認協助抽獎？</h2><div class="proxy-person-confirm"><p>請確認代抽同仁姓名</p><strong>${esc(p.name)}</strong></div><div class="proxy-actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="proxy-draw-confirm">確認待抽</button></div></div>`);$('#cancel').onclick=closeDialog;$('#proxy-draw-confirm').onclick=()=>beginDraw(id);}
function beginDraw(id){try{draw(state,id,role,method);save();const d=dialog('P02','',`<div class="modal-body"><div class="draw-orbit" aria-hidden="true"><span>✦</span></div><p class="draw-loading-label" role="status">抽獎中....</p></div>`,{locked:true});d.classList.add('draw-animation-dialog');d.setAttribute('aria-label','抽獎中');setTimeout(()=>showPrize(id),1300);}catch(e){message('無法抽獎',e.message);}}
function prizeTicket(p){return `<div class="prize-ticket"><small>獎品編號 ${esc(p.prize.number)}</small><h3>${esc(p.prize.name)}</h3></div>`;}
function showPrize(id){const p=person(state,id);if(!p.prize)return message('尚無獎項','請先完成抽獎。');const info=methodInfo(p.prize.method),onsite=p.prize.method==='onsite';dialog('P03','抽獎結果',`<div class="modal-body"><div class="medallion">${icon('gift')}</div><h2>抽獎結果</h2>${prizeTicket(p)}<div class="claim-instruction"><div class="claim-status"><h4>${esc(info.resultLabel)}</h4><strong>${onsite?(p.prize.claimed?'已領取':'未領取'):esc(info.status)}</strong></div><p>${esc(info.instruction)}</p></div>${onsite&&!p.prize.claimed?`<button class="primary" id="open-code">${icon('scan')}開啟QR code 領獎</button>`:''}<button class="${onsite&&!p.prize.claimed?'secondary':'primary'}" id="prize-close">關閉</button></div>`);$('#prize-close').onclick=closeDialog;if($('#open-code'))$('#open-code').onclick=()=>showCode(id);}

function illustrativeCode(seed){let n=0;for(const c of seed)n=(n*31+c.charCodeAt(0))>>>0;let cells='';const size=29;function finder(x,y){cells+=`<rect x="${x}" y="${y}" width="7" height="7" fill="#222"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="white"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#222"/>`;}for(let y=0;y<size;y++)for(let x=0;x<size;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;n=(n*1664525+1013904223)>>>0;if(n%3!==0)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}finder(0,0);finder(22,0);finder(0,22);return `<svg viewBox="-2 -2 33 33" role="img" aria-label="靜態領獎碼示意圖，請使用模擬掃描體驗核銷" shape-rendering="crispEdges" fill="#222"><rect x="-2" y="-2" width="33" height="33" fill="white"/>${cells}</svg>`;}
function showCode(id){const p=person(state,id);dialog('P07','',`<div class="modal-body"><h2>${p.prize.claimed?'已完成領取':'請向工作人員出示'}</h2><p>現場掃描後即完成核銷，請勿重複使用。</p>${p.prize.claimed?`<div class="medallion">${icon('check')}</div>`:`<div class="code-wrap">${illustrativeCode(id+p.prize.number)}</div>`}<button class="primary" id="code-back">關閉</button></div>`);$('dialog').setAttribute('aria-label','領獎碼');$('#modal-close').onclick=()=>showPrize(id);$('#code-back').onclick=()=>showPrize(id);$('dialog').addEventListener('cancel',e=>{e.preventDefault();showPrize(id);},{once:true});}
function proxyClaim(id){const p=person(state,id);if(!permission().canAssist)return toast('僅主辦方可以協助領獎。');dialog('P09','',`<div class="modal-body"><div class="medallion">${icon('gift')}</div><h2>確認協助領獎？</h2><div class="result-rows"><div class="result-row"><span>被代領同仁</span><strong>${esc(p.name)}</strong></div><div class="result-row"><span>獎品編號</span><strong>${esc(p.prize.number)}</strong></div><div class="result-row"><span>獎項名稱</span><strong>${esc(p.prize.name)}</strong></div></div><div class="proxy-actions"><button class="secondary" id="cancel">關閉</button><button class="primary" id="proxy-claim-confirm">確認代領</button></div></div>`);$('#cancel').onclick=closeDialog;$('#proxy-claim-confirm').onclick=()=>{try{redeem(state,id,role,true);save();showRedemption(true,p,'');}catch(e){showRedemption(false,p,e.message);}};}
function scanNow(){const id=MOBILE?(state.people.find(p=>p.id===CURRENT.participant&&p.prize?.method==='onsite'&&!p.prize.claimed)?.id||state.people.find(p=>p.prize?.method==='onsite'&&!p.prize.claimed)?.id||'invalid'):$('#scan-target').value;try{if(id==='invalid')throw Error('這不是本活動有效的領獎碼，請重新掃描。');if(id==='unknown')throw Error('查無獎項資料，請確認領獎碼或洽主辦方。');if(id==='denied')throw Error('您沒有核銷權限，請由主辦方操作。');const p=redeem(state,id,role);save();showRedemption(true,p,'');}catch(e){const p=state.people.find(p=>p.id===id);showRedemption(false,p,e.message);}}
function showRedemption(ok,p,error){dialog('P05','核銷結果',`<div class="modal-body"><div class="medallion">${icon(ok?'check':'info')}</div><h2>${ok?'核銷成功':'無法核銷'}</h2><p>${ok?'請依獎品編號交付實體獎品。':esc(error)}</p>${p?.prize?`<div class="result-rows"><div class="result-row"><span>獎品編號</span><strong>${esc(p.prize.number)}</strong></div><div class="result-row"><span>獎項名稱</span><strong>${esc(p.prize.name)}</strong></div></div>`:''}<div class="proxy-actions redemption-actions"><button class="secondary" id="redemption-close">關閉</button><button class="primary" id="redemption-continue">繼續掃描</button></div></div>`);$('#redemption-close').onclick=closeDialog;$('#redemption-continue').onclick=()=>{view='P06';closeDialog();};}
function editNote(id){const p=person(state,id),existing=$('dialog');if(existing)existing.close();lastFocus=document.activeElement;modalPage='';const selected=config.noShowReasons.find(r=>p.note.startsWith(r))||config.noShowReasons[0];$('#overlay').innerHTML=`<dialog class="note-sheet" aria-label="${esc(p.name)}的 No Show 備註"><header class="note-sheet-head">No Show 備註</header><div class="note-sheet-options">${config.noShowReasons.map(r=>`<label class="note-option"><input type="radio" name="reason" value="${esc(r)}" ${r===selected?'checked':''}><span>${esc(r)}</span><img src="data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjE4IiBoZWlnaHQ9IjE4IiB2aWV3Qm94PSIwIDAgMTggMTgiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJjaGVja19zZWxlY3RvciIgY2xpcC1wYXRoPSJ1cmwoI2NsaXAwXzBfMjApIj4KPHBhdGggaWQ9IlZlY3RvciAxMDEiIGQ9Ik0wLjUgOS4yODU3MUw1Ljk4Mzg3IDE1TDE3LjUgMyIgc3Ryb2tlLXdpZHRoPSIxLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgc3Ryb2tlPSIjOUE1NkQzIi8+CjwvZz4KPGRlZnM+CjxjbGlwUGF0aCBpZD0iY2xpcDBfMF8yMCI+CjxyZWN0IHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgZmlsbD0id2hpdGUiLz4KPC9jbGlwUGF0aD4KPC9kZWZzPgo8L3N2Zz4K" width="18" height="18" alt=""></label>`).join('')}</div><div class="note-sheet-actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="save-note">確定</button></div></dialog>`;const d=$('dialog');d.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});$('#cancel').onclick=closeDialog;$('#save-note').onclick=()=>{try{note(state,id,role,$('input[name="reason"]:checked').value);save();closeDialog();toast('備註已更新');}catch(e){message('無法儲存',e.message);}};d.showModal();positionNoteSheet();}
function positionNoteSheet(){const d=$('dialog.note-sheet');if(!d)return;const rect=$('.device')?.getBoundingClientRect(),width=Math.min(rect?.width||innerWidth,innerWidth);d.style.width=width+'px';d.style.left=Math.max(0,Math.min(rect?.left||0,innerWidth-width))+'px';d.style.top=Math.max(12,Math.min(rect?rect.bottom-21:innerHeight,innerHeight)-d.getBoundingClientRect().height)+'px';}
window.addEventListener('resize',positionNoteSheet);
function showHome(){dialog('','EBS 首頁',`<div class="modal-body"><div class="medallion">${icon('grid')}</div><h2>EBS 首頁</h2><p>此原型聚焦活動報到與春酒抽獎，點選下方進入活動專區。</p><button class="primary" id="enter-events">活動專區${icon('arrow')}</button></div>`);$('#enter-events').onclick=()=>{view='P01';closeDialog();};}
function renderMarkdown(raw){let blocks=[],text=esc(raw).replace(/```([a-z]*)\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code>${c}</code></pre>`);return `\n@@BLOCK${blocks.length-1}@@\n`;});let lines=text.split('\n'),out='',list='',table=false;const inline=s=>s.replace(/(https:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');const endList=()=>{if(list){out+=`</${list}>`;list='';}};const endTable=()=>{if(table){out+='</tbody></table>';table=false;}};for(const line of lines){const m=line.match(/^@@BLOCK(\d+)@@$/);if(m){endList();endTable();out+=blocks[+m[1]];continue;}if(line.startsWith('|')){endList();if(/^\|[\s:|-]+\|$/.test(line))continue;const cells=line.split('|').slice(1,-1);if(!table){out+='<table><thead><tr>'+cells.map(c=>`<th>${inline(c.trim())}</th>`).join('')+'</tr></thead><tbody>';table=true;}else out+='<tr>'+cells.map(c=>`<td>${inline(c.trim())}</td>`).join('')+'</tr>';continue;}endTable();if(/^#{1,3} /.test(line)){endList();const n=line.match(/^#+/)[0].length;out+=`<h${n}>${inline(line.slice(n+1))}</h${n}>`;}else if(/^\s*- /.test(line)||/^\d+\. /.test(line)){const type=/^\d/.test(line)?'ol':'ul';if(list!==type){endList();out+=`<${type}>`;list=type;}const depth=Math.floor((line.match(/^\s*/)[0].length)/2);out+=`<li style="margin-left:${depth*18}px">${inline(line.replace(/^\s*- |^\d+\. /,''))}</li>`;}else{endList();if(line.trim())out+=`<p>${inline(line)}</p>`;}}endList();endTable();return out;}
function showDocs(index=0){dialog('','流程規格文件',`<div class="docs-layout"><nav class="docs-nav" aria-label="規格文件切換">${docNames.map((n,i)=>`<button class="${i===index?'active':''}" data-switch-doc="${i}">${esc(n)}</button>`).join('')}<a href="${$('#embedded-documents')?'data:text/markdown;charset=utf-8,'+encodeURIComponent(documents[index]):'./docs/'+FILES[index]}" download="${FILES[index]}">↓ 下載目前 Markdown</a><div class="docs-tip">文件的 JSON 區塊用於產生原型設定；來源差異與暫定規則也記錄於文件。</div></nav><article class="docs-content markdown">${renderMarkdown(documents[index])}</article></div>`,{wide:true});document.querySelectorAll('[data-switch-doc]').forEach(b=>b.onclick=()=>showDocs(+b.dataset.switchDoc));}
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue){try{const latest=JSON.parse(e.newValue);if(latest.version===2){state=latest;render();if(modalPage==='P07'||modalPage==='P03'){closeDialog();toast('領獎狀態已更新，請重新查看獎項。');}}}catch{}}});
boot();
})();
</script></body></html>
